name: defunciones_app
description: "App para gestionar registros de defunciones con almacenamiento local usando Hive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  pdf: ^3.10.8
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  universal_html: ^2.3.0
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
